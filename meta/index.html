<!DOCTYPE html>
<html lang="en" class="meta-page">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta - Gino Angelici</title>
    <meta name="description" content="A short summary of GitHub activity — repositories, languages, and recent work.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ginoangelici.com/meta/">
    <meta property="og:title" content="Meta - GitHub Activity">
    <meta property="og:description" content="A short summary of GitHub activity — repositories, languages, and recent work.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">

    <!-- Studio fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
    <script src="../global.js" type="module"></script>
</head>
<body>
    <main>
        <article class="prose">
            <span class="eyebrow">GitHub</span>
            <h1>Activity</h1>
            <p class="lede">A live summary, pulled from the GitHub API — <a href="https://github.com/AncientAbacus" target="_blank">@AncientAbacus</a>.</p>

            <div id="loading-overlay" class="loading-overlay">
                <p>Fetching GitHub data…</p>
            </div>

            <dl class="plain">
                <div><dt>Repositories</dt><dd id="stat-repos">0</dd></div>
                <div><dt>Stars earned</dt><dd id="stat-stars">0</dd></div>
                <div><dt>Forks</dt><dd id="stat-forks">0</dd></div>
                <div><dt>Languages</dt><dd id="stat-languages">0</dd></div>
                <div><dt>Followers</dt><dd id="followers-count">0</dd></div>
                <div><dt>Member since</dt><dd id="join-date">—</dd></div>
            </dl>

            <h2>Languages</h2>
            <div id="language-bars" class="lang-bars"></div>

            <h2>Top repository</h2>
            <p id="top-repo-line">Loading…</p>

            <h2>Recently updated</h2>
            <ul id="recent-repos" class="recent-list"></ul>
        </article>
    </main>

    <script src="main.js" type="module"></script>
</body>
</html>
