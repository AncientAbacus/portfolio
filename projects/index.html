<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Gino Angelici</title>
    <meta name="description" content="Explore my data science and machine learning projects including solar energy analysis, NLP for Pokémon data, and electrical grid infrastructure visualization.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ginoangelici.com/projects/">
    <meta property="og:title" content="Data Science Projects - Gino Angelici">
    <meta property="og:description" content="Explore my data science and machine learning projects including solar energy analysis, NLP, and data visualization.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">

    <!-- Dark Fantasy Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

    <link href="../style.css" rel="stylesheet">
    <script src="../global.js" type="module"></script>
    <script src="./projects.js" type="module"></script>
</head>
<body>
    <main class="projects-main">
        <div class="projects-page-header">
            <h1>✦ Projects ✦</h1>
            <p class="projects-subtitle">data science · machine learning · algorithms</p>
            <input
                class="searchBar"
                type="search"
                aria-label="Search projects"
                placeholder="SEARCH_PROJECTS..."
            />
        </div>
        <div class="projects"></div>
        <!-- Dedicated D3 pie chart target (not displayed) -->
        <svg id="projects-pie-chart" aria-hidden="true" style="display:none"></svg>
    </main>

    <!-- Star field canvas -->
    <canvas id="star-canvas"></canvas>

    <script>
    (function () {
        const canvas = document.getElementById('star-canvas');
        const ctx    = canvas.getContext('2d');
        let stars    = [];
        const palette = [
            [74,  222, 128], // green
            [134, 239, 172], // light green
            [251, 191, 36 ], // gold
        ];

        function resize() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function init() {
            resize();
            stars = Array.from({ length: 60 }, () => {
                const c = palette[Math.floor(Math.random() * palette.length)];
                return {
                    x:     Math.random() * canvas.width,
                    y:     Math.random() * canvas.height,
                    r:     Math.random() * 1 + 0.25,
                    speed: Math.random() * 0.010 + 0.003,
                    phase: Math.random() * Math.PI * 2,
                    color: c,
                };
            });
        }

        function draw(t) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const s of stars) {
                const alpha = 0.15 + 0.45 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${s.color[0]}, ${s.color[1]}, ${s.color[2]}, ${alpha.toFixed(3)})`;
                ctx.fill();
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);
        init();
        requestAnimationFrame(draw);
    })();
    </script>
</body>
</html>
