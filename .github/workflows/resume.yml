# Rebuilds the resume PDF and resume page whenever resume/source/resume.tex changes.
name: Sync resume

on:
  push:
    branches: [main]
    paths:
      - resume/source/resume.tex
      - scripts/build_resume_page.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile resume PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: resume/source

      - name: Publish PDF and update resume page
        run: |
          mv resume/source/resume.pdf resume/Gino_Angelici_Resume.pdf
          python3 scripts/build_resume_page.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add resume/Gino_Angelici_Resume.pdf resume/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Sync resume from resume.tex"
          git push
