# Rebuilds the resume page, home page and projects.json whenever resume/source/resume.tex changes.
name: Sync resume

on:
  push:
    branches: [main]
    paths:
      - resume/source/resume.tex
      - scripts/build_resume_page.py
  workflow_dispatch:

concurrency: resume

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update resume page
        run: python3 scripts/build_resume_page.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add experience/index.html index.html lib/projects.json
          git diff --cached --quiet && exit 0
          git commit -m "Sync resume from resume.tex"
          git push
